<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { --bg: #1e1e1e; --card: #2c2c2c; --field: #383838; --line: #444; --text: #fff; --dim: #b3b3b3; --accent: #0c8ce9; --ok: #2bd67b; --err: #ff5a5f; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 12px; background: var(--bg); color: var(--text); font: 12px/1.45 Inter, system-ui, sans-serif; }
      h1 { font-size: 14px; margin: 0 0 2px; }
      .sub { color: var(--dim); font-size: 11px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-top: 10px; }
      button { font: inherit; font-weight: 600; color: var(--text); background: var(--accent); border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
      button:disabled { opacity: 0.45; cursor: default; }
      .help { color: var(--dim); font-size: 11px; margin-top: 6px; }
      #log { height: 220px; overflow: auto; background: #0d0d0d; border-radius: 6px; padding: 6px; margin-top: 6px; font: 11px/1.4 ui-monospace, Menlo, monospace; color: var(--dim); white-space: pre-wrap; }
      #log .ok { color: var(--ok); } #log .error { color: var(--err); }
    </style>
  </head>
  <body>
    <h1>Figma OS (gate level)</h1>
    <div class="sub">os-ui, 1:1, run by Figma's prototype engine</div>
    <div class="card">
      <button id="editor">Build the editor</button>
      <div class="help">Puts os-ui's screen on the page "Figma OS", taken from the running app (osui/capture), layer for layer.</div>
    </div>
    <div class="card"><div id="log"></div></div>
    <script>"use strict";
(() => {
  // osui/plugin/ui/ui.ts
  var $ = (id) => document.getElementById(id);
  var send = (m) => parent.postMessage({ pluginMessage: m }, "*");
  var log = (level, text) => {
    const line = document.createElement("div");
    line.className = level;
    line.textContent = text;
    $("log").appendChild(line);
    $("log").scrollTop = 1e9;
  };
  $("editor").onclick = () => send({ type: "editor" });
  window.onmessage = (e) => {
    const m = e.data.pluginMessage;
    if (!m) return;
    if (m.type === "log") log(m.level, m.text);
    if (m.type === "busy") for (const b of document.querySelectorAll("button")) b.disabled = !!m.what;
    if (m.type === "progress") log("info", `${m.done}/${m.total} ${m.label}`);
  };
})();
</script>
  </body>
</html>
