<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 280px;
        padding: 14px;
        font:
          12px/1.45 -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #1e1e1e;
        color: #e8e8e8;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 13px;
        font-weight: 600;
      }
      .row {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        border-bottom: 1px solid #2c2c2c;
      }
      .row span:first-child {
        color: #9a9a9a;
      }
      label {
        display: block;
        margin: 12px 0 4px;
        color: #9a9a9a;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #3a3a3a;
        background: #2c2c2c;
        color: inherit;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
      }
      .hint {
        margin-top: 10px;
        color: #8a8a8a;
        font-size: 11px;
      }
      #dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #777;
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <h1><span id="dot"></span>Figma CPU Live Link</h1>
    <div class="row"><span>Supabase</span><span id="status">…</span></div>
    <div class="row"><span>Program</span><span id="program">–</span></div>
    <div class="row"><span>Tick · phase</span><span id="clock">–</span></div>
    <div class="row"><span>Messages sent</span><span id="sent">0</span></div>
  <div class="row"><span>OS inputs sent</span><span id="inputs">0</span></div>
    <label for="channel">Channel (the Make app joins the same one)</label>
    <input id="channel" type="text" spellcheck="false" />
    <div class="toggle">
      <input id="enabled" type="checkbox" /><label
        for="enabled"
        style="margin: 0; color: inherit"
        >Streaming on</label
      >
    </div>
    <p class="hint">
      Open FINAL CPU in Present with the CPU tab showing. Needs Options →
      Accessibility settings → “Adapt content for screen readers” on.
    </p>
    <script src="popup.js" type="module"></script>
  </body>
</html>
